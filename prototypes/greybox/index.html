<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>应许之路 · 守营试玩</title>
<style>
:root{color-scheme:dark;--ink:#f8eed9;--muted:#cebea2;--ground:#181612;--plate:#242018;--line:#62543c;--gold:#e7bf7c;--sage:#c9d7ad;--rust:#ffb496}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}
header,main,footer{width:min(1136px,calc(100% - 36px));margin:auto}
header{padding:30px 0 18px;display:flex;justify-content:space-between;align-items:end;gap:12px;border-bottom:1px solid var(--line)}
h1,h2,h3,p{margin:0}
h1{font:700 clamp(30px,5vw,52px)/1.15 "Songti SC",SimSun,serif;letter-spacing:.11em}
h2,h3{font-family:"Songti SC",SimSun,serif}
header p{color:var(--gold);margin-bottom:6px}
.save{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
button{font:inherit;color:var(--ink);cursor:pointer;background:#2c271d;border:1px solid var(--line);padding:7px 10px;min-height:38px;text-align:left}
button:hover:not(:disabled){border-color:var(--gold)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
button[aria-pressed=true]{background:#4c3d26;border-color:var(--gold)}
button[aria-pressed=true] strong::before{content:"✓ "}
button:disabled{opacity:.57;cursor:not-allowed}
main{padding-top:16px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}
.metrics div{background:var(--plate);padding:8px 12px}
.metrics span{display:block;color:var(--muted);font-size:13px}
.metrics strong{font-size:23px;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,1.05fr);gap:16px;align-items:start}
.panel{border:1px solid var(--line);background:var(--plate);padding:16px}
.map{min-height:286px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:end;position:relative;isolation:isolate;overflow:hidden;background:repeating-linear-gradient(142deg,transparent 0 30px,#f1c78d10 31px 32px),linear-gradient(160deg,#6d5032,#2b241c 74%);padding:14px;margin-top:10px;border:1px solid var(--line)}
.night .map{background:repeating-linear-gradient(142deg,transparent 0 30px,#f1c78d10 31px 32px),linear-gradient(160deg,#303d4b,#202127 74%)}
.ridge{position:absolute;inset:12% -6% auto;width:110%;height:56%;background:#14130e60;clip-path:polygon(0 88%,14% 53%,29% 63%,48% 7%,61% 40%,74% 31%,100% 83%,100% 100%,0 100%);z-index:-1}
.site{min-height:120px;background:#201b15e8;border:1px solid #a78b61;padding:10px;display:grid;align-content:end}
.site.guarded{border:2px solid var(--sage);padding:9px}
.site small,.card small,.hint,.muted,footer{color:var(--muted)}
.terrain{display:flex;gap:4px;height:24px;align-items:end;margin-bottom:7px}
.terrain i{width:22px;height:10px;background:#7f6546;border-top:3px solid #b79b70;transform:skew(-12deg)}
.terrain i.built{height:22px;background:#bfa276;border-color:#e5cc9e}
.shelter{width:43px;height:27px;background:#d7b37e;clip-path:polygon(50% 0,100% 100%,0 100%);margin-bottom:7px}
.phase{color:var(--gold);font-variant-numeric:tabular-nums}
#boardState{margin-bottom:8px}
.groups{display:grid;gap:8px;margin:12px 0}
fieldset{min-width:0;margin:0;border:1px solid var(--line);padding:6px 7px 8px}
legend{padding:0 5px;font-weight:bold}
.choices{display:flex;flex-wrap:wrap;gap:5px}
.card{flex:1 1 100px;font-size:13px}
.card strong,.card small{display:block}
.clues{padding:8px 0}
.clue{margin:3px 0;border-left:2px solid var(--gold);padding-left:8px;font-size:14px}
.primary{background:var(--gold);color:#22180e;font-weight:bold;text-align:center;width:100%;border-color:var(--gold);margin-top:6px}
.hint{min-height:1.6em;font-size:13px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--gold)}
ol{padding-left:20px;margin:5px 0}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:3px 15px;margin:12px 0}
.breakdown dt,.breakdown dd{border-bottom:1px solid #62543c80;margin:0}
.good{color:var(--sage)}.bad{color:var(--rust)}
footer{font-size:13px;margin-bottom:26px;padding:8px 0}
a{color:var(--gold)}
@media(max-width:760px){header{align-items:start;flex-direction:column}.save{justify-content:start}.board{grid-template-columns:1fr}.map{min-height:170px}.metrics div{padding:5px 8px}}
</style>
</head>
<body>
<header>
  <div><p>双夜营地 · 约 5 分钟</p><h1>应许之路</h1></div>
  <div class="save">
    <button id="exportSave" type="button">导出存档</button>
    <button id="importSave" type="button">导入存档</button>
    <button id="restart" type="button">重开</button>
    <input id="saveInput" type="file" accept="application/json,.json" hidden>
  </div>
</header>
<main>
  <div id="metrics" class="metrics" aria-label="营地状态"></div>
  <div class="board" id="board">
    <section class="panel" aria-labelledby="map-title">
      <h2 id="map-title">营地图</h2>
      <div id="map" class="map"></div>
      <details id="campLog"><summary>营地纪事</summary><ol id="history"></ol></details>
    </section>
    <section class="panel" aria-label="本轮决策">
      <div id="boardState" class="phase"></div>
      <div id="scene"></div>
      <p id="saveStatus" class="hint" role="status"></p>
    </section>
  </div>
</main>
<footer>
  <details><summary>经文与原创演绎</summary>
    <p>经文依据：《尼希米记》4:9 记述祷告与昼夜设防，6:10–14 记述尼希米分辨示玛雅的劝告。</p>
    <p>原创演绎：双夜营地、两轮证词、袭扰、资源与守备规则均为灰模虚构；人物与事件未作经文重演。</p>
    <p><a href="https://www.wordproject.org/bibles/gb/16/4.htm" target="_blank" rel="noopener">尼希米记 4 章</a> · <a href="https://www.wordproject.org/bibles/gb/16/6.htm" target="_blank" rel="noopener">尼希米记 6 章</a></p>
  </details>
</footer>
<script src="sim.js"></script>
<script src="render.js"></script>
</body>
</html>
